apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexaai-redis
  namespace: nexaai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexaai-redis
  template:
    metadata:
      labels:
        app: nexaai-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nexaai-redis
  namespace: nexaai
spec:
  selector:
    app: nexaai-redis
  ports:
    - port: 6379
      targetPort: 6379
