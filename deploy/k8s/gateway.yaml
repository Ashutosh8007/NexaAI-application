apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexaai-gateway
  namespace: nexaai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexaai-gateway
  template:
    metadata:
      labels:
        app: nexaai-gateway
    spec:
      containers:
        - name: gateway
          image: nexaai-lab:dev
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.gateway.main:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: nexaai-config
          env:
            - name: DEMO_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nexaai-demo-secret
                  key: DEMO_API_TOKEN
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nexaai-gateway
  namespace: nexaai
spec:
  selector:
    app: nexaai-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP
